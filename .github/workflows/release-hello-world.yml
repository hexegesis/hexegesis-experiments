name: Publier l'ISO Hello World

# main construit l'image afin que le badge du README mesure la procédure de
# référence. Seuls les tags de cet exemple déclenchent sa publication.
on:
  push:
    branches:
      - main
    tags:
      - "hello-world-v*"

# gh release create utilise le jeton éphémère fourni par GitHub Actions pour
# créer la release et y joindre l'ISO.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le commit étiqueté
        uses: actions/checkout@v4

      # build.sh reste l'unique procédure de construction : la CI ne duplique
      # ni la chaîne Docker, ni les vérifications de l'image ISO.
      - name: Construire l'ISO
        working-directory: hello-world
        run: ./scripts/build.sh

      # Cette étape ne s'exécute que pour un tag : les constructions de main
      # alimentent le badge sans créer de release. L'ISO est publiée directement
      # dans la GitHub Release plutôt que comme artefact temporaire de CI.
      - name: Créer la release
        if: startsWith(github.ref, 'refs/tags/hello-world-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            hello-world/hello-world.iso \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
